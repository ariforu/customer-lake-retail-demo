resources:
  jobs:
    strideforge_medallion:
      name: strideforge_medallion
      description: >
        Bronze -> silver -> gold for the StrideForge CDP: conformance, identity resolution, Customer 360,
        propensity scores, audiences/triggers for activation, and campaign measurement.
      tags:
        project: strideforge_cdp
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0 5 * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      tasks:
        # ---------------- silver
        - task_key: ensure_tables
          notebook_task:
            notebook_path: ../src/ddl/02_silver.py
            base_parameters: &params
              catalog: ${var.catalog}
              bronze: ${var.bronze_schema}
              silver: ${var.silver_schema}
              gold: ${var.gold_schema}
              truth: ${var.truth_schema}

        - task_key: ensure_gold_tables
          depends_on: [{task_key: ensure_tables}]
          notebook_task:
            notebook_path: ../src/ddl/03_gold.py
            base_parameters: *params

        - task_key: silver_functions
          depends_on: [{task_key: ensure_gold_tables}]
          notebook_task:
            notebook_path: ../src/silver/00_functions.py
            base_parameters: *params

        - task_key: silver_reference
          depends_on: [{task_key: silver_functions}]
          notebook_task:
            notebook_path: ../src/silver/01_reference.py
            base_parameters: *params

        - task_key: silver_identity_resolution
          depends_on: [{task_key: silver_reference}]
          notebook_task:
            notebook_path: ../src/silver/02_identity_resolution.py
            base_parameters: *params

        - task_key: silver_commerce
          depends_on: [{task_key: silver_identity_resolution}]
          notebook_task:
            notebook_path: ../src/silver/03_commerce.py
            base_parameters: *params

        - task_key: silver_behavior
          depends_on: [{task_key: silver_identity_resolution}]
          notebook_task:
            notebook_path: ../src/silver/04_behavior.py
            base_parameters: *params

        - task_key: silver_loyalty_sport
          depends_on: [{task_key: silver_identity_resolution}]
          notebook_task:
            notebook_path: ../src/silver/05_loyalty_sport.py
            base_parameters: *params

        - task_key: silver_marketing
          depends_on: [{task_key: silver_commerce}, {task_key: silver_behavior}]
          notebook_task:
            notebook_path: ../src/silver/06_marketing.py
            base_parameters: *params

        - task_key: silver_service
          depends_on: [{task_key: silver_commerce}]
          notebook_task:
            notebook_path: ../src/silver/07_service.py
            base_parameters: *params

        - task_key: silver_ai_review_enrichment
          depends_on: [{task_key: silver_service}]
          notebook_task:
            notebook_path: ../src/silver/07b_ai_enrichment.py
            base_parameters: *params

        - task_key: silver_customer_enrichment
          depends_on: [{task_key: silver_commerce}]
          notebook_task:
            notebook_path: ../src/silver/08_customer_enrichment.py
            base_parameters: *params

        # ---------------- gold
        - task_key: gold_customer_360
          depends_on: [{task_key: silver_customer_enrichment}, {task_key: silver_marketing},
                       {task_key: silver_loyalty_sport}, {task_key: silver_ai_review_enrichment}]
          notebook_task:
            notebook_path: ../src/gold/01_customer_360.py
            base_parameters: *params

        - task_key: gold_predictions_products
          depends_on: [{task_key: gold_customer_360}]
          notebook_task:
            notebook_path: ../src/gold/02_predictions_products.py
            base_parameters: *params

        - task_key: gold_audiences
          depends_on: [{task_key: gold_predictions_products}]
          notebook_task:
            notebook_path: ../src/gold/03_audiences.py
            base_parameters: *params

        - task_key: gold_measurement
          depends_on: [{task_key: gold_customer_360}]
          notebook_task:
            notebook_path: ../src/gold/04_measurement.py
            base_parameters: *params
