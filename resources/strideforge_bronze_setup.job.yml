resources:
  jobs:
    strideforge_bronze_setup:
      name: strideforge_bronze_setup
      description: >
        Creates the StrideForge bronze/silver/gold schemas and tables, then generates the synthetic bronze layer
        (1.5M customers at scale=1.0). Run once per workspace before strideforge_medallion.
      tags:
        project: strideforge_cdp
      max_concurrent_runs: 1
      tasks:
        - task_key: ddl_bronze
          notebook_task:
            notebook_path: ../src/ddl/01_bronze.py
            base_parameters: &params
              catalog: ${var.catalog}
              bronze: ${var.bronze_schema}
              silver: ${var.silver_schema}
              gold: ${var.gold_schema}
              truth: ${var.truth_schema}

        - task_key: ddl_silver
          depends_on: [{task_key: ddl_bronze}]
          notebook_task:
            notebook_path: ../src/ddl/02_silver.py
            base_parameters: *params

        - task_key: ddl_gold
          depends_on: [{task_key: ddl_silver}]
          notebook_task:
            notebook_path: ../src/ddl/03_gold.py
            base_parameters: *params

        - task_key: generate_bronze
          depends_on: [{task_key: ddl_gold}]
          timeout_seconds: 14400
          notebook_task:
            notebook_path: ../src/generator/generate_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              bronze: ${var.bronze_schema}
              truth: ${var.truth_schema}
              scale: ${var.scale}

        - task_key: validate_bronze
          depends_on: [{task_key: generate_bronze}]
          notebook_task:
            notebook_path: ../src/generator/validate_bronze.py
            base_parameters:
              catalog: ${var.catalog}
              bronze: ${var.bronze_schema}
              truth: ${var.truth_schema}
